name: budget_giornaliero
description: Un'applicazione per calcolare il budget giornaliero.
publish_to: 'none'
version: 1.1.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.18.1
  google_fonts: 6.1.0
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  excel: ^4.0.3
  path_provider: ^2.1.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
