name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare buildozer
        run: |
          cp native_app/buildozer.spec .
          cp native_app/main.py .
          cp native_app/requirements.txt .

      - name: Build with Buildozer
        uses: digreatbrian/buildozer-action@v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: budget-calculator-apk
          path: bin/*.apk
